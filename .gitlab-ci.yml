# vim: tabstop=4 shiftwidth=4 softtabstop=4

default:
    image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-cuda:latest"
    tags:
        - docker
    retry:
        max: 1
        when:
            - api_failure
            - runner_system_failure
            - stuck_or_timeout_failure

stages:
    - lint
    - build
    - build:cuda
    - build:hip_rocm
    - build:host
    - build:doc
    - deploy

# https://docs.gitlab.com/ee/ci/yaml/workflow.html
workflow:
    rules:
        # run a pipeline in the merge request context
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        # don't run a branch pipeline on push when there is an open merge request
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
          when: never
        # otherwise run a branch pipeline
        - if: $CI_COMMIT_BRANCH

# default flags for cmake
.default_cmake_flags: &default_cmake_flags
    # architectures
    USE_CUDA: "no"
    USE_HIP: "no"
    # MPI is selectively added to targets, so there is no point to have separate jobs without MPI
    USE_MPI: "yes"
    USE_OPENMP: "yes"
    # build targets
    BUILD_COVERAGE: "no"
    BUILD_DOC: "no"  # only used in the "documentation" job
    # toolchain flags defaults
    # The runners mix hosts with and without AVX-512, so compile for the common baseline
    # (x86-64-v3, i.e. AVX2). Host-specific objects would otherwise end up in the shared
    # sccache and crash with SIGILL on a host with fewer instruction set extensions: nvhpc
    # targets the local CPU by default, and TNL_USE_MARCH_NATIVE_FLAG would add -march=native
    # to Release builds if it was ever enabled.
    TNL_USE_MARCH_NATIVE_FLAG: "no"
    CMAKE_C_FLAGS: "-march=x86-64-v3"
    CMAKE_CXX_FLAGS: "-march=x86-64-v3"
    CMAKE_CUDA_FLAGS: ""
    CMAKE_HIP_FLAGS: "-march=x86-64-v3"
    CMAKE_EXE_LINKER_FLAGS: ""
    CMAKE_SHARED_LINKER_FLAGS: ""
    # avoid Open MPI abort on dual-accelerator hosts (both CUDA and ROCm detected)
    OMPI_MCA_accelerator: "null"

# base for GCC builds
.gcc:
    stage: build:host
    variables:
        <<: *default_cmake_flags
        CXX: g++
        CC: gcc

# base for NVCC builds
.nvcc:
    stage: build:cuda
    tags:
        - docker
        - nvidia
    variables:
        <<: *default_cmake_flags
        USE_CUDA: "yes"
        # nvcc does not accept -march itself, so forward it to the host compiler
        CMAKE_CUDA_FLAGS: "-Xcompiler=-march=x86-64-v3"
        # CUDA builds run on runners with GPU passthrough
        OMPI_MCA_accelerator: "cuda"

# base for NVHPC builds
.nvhpc:
    image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-nvhpc:latest"
    variables:
        <<: *default_cmake_flags
        USE_CUDA: "yes"
        CXX: nvc++
        CC: nvc
        CUDACXX: nvcc
        CUDAHOSTCXX: nvc++
        # nvcc does not accept -march itself, so forward it to the nvc++ host compiler;
        # nvc++ otherwise targets the CPU of the machine that compiles the code
        CMAKE_CUDA_FLAGS: "-Xcompiler=-march=x86-64-v3"
        # CUDA builds run on runners with GPU passthrough
        OMPI_MCA_accelerator: "cuda"

# base for Clang builds
.clang:
    stage: build:host
    variables:
        <<: *default_cmake_flags
        CXX: clang++
        CC: clang
        CUDAHOSTCXX: clang++
        # also use LLVM's libc++ instead of GCC's libstdc++ (which is used by default)
        CMAKE_CXX_FLAGS: "-stdlib=libc++ -march=x86-64-v3"
        # use the LLVM linker and link to libc++
        CMAKE_EXE_LINKER_FLAGS: "-fuse-ld=lld -lc++ -lc++abi"
        CMAKE_SHARED_LINKER_FLAGS: "-fuse-ld=lld -lc++ -lc++abi"

# base for Clang CUDA builds
.clang_cuda:
    stage: build:cuda
    tags:
        - docker
        - nvidia
    extends: .clang
    variables:
        CUDACXX: clang++
        CUDAHOSTCXX: clang++
        # CUDA does not support libc++ on x86 systems
        CMAKE_CUDA_FLAGS: "-stdlib=libstdc++ -march=x86-64-v3"
        CMAKE_CXX_FLAGS: "-stdlib=libstdc++ -Wno-error=pass-failed -march=x86-64-v3"
        CMAKE_EXE_LINKER_FLAGS: "-fuse-ld=lld -lomp"
        CMAKE_SHARED_LINKER_FLAGS: "-fuse-ld=lld -lomp"
        USE_CUDA: "yes"
        # CUDA builds run on runners with GPU passthrough
        OMPI_MCA_accelerator: "cuda"

# base for Intel oneAPI builds
.icpx:
    stage: build:host
    image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-oneapi:latest"
    variables:
        <<: *default_cmake_flags
        CXX: icpx
        CC: icx

# base for HIP/ROCm builds
.hip_rocm:
    stage: build:hip_rocm
    image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-rocm:latest"
    tags:
        - docker
        - hip-rocm
    variables:
        <<: *default_cmake_flags
        USE_HIP: "yes"
        USE_OPENMP: "no"   # TODO: enabling OpenMP leads to false warnings due to unused variable
        # ROCm builds run on runners with AMD GPU passthrough
        OMPI_MCA_accelerator: "rocm"

# template for environment setup before build
.env_setup: &env_setup
    # make sure that $PATH and other essential variables are set correctly
    - source /etc/profile
    # all cores including hyperthreading
    #- export NUM_CORES=$(grep "core id" /proc/cpuinfo | wc -l)
    # all physical cores
    - export NUM_CORES=$(grep "core id" /proc/cpuinfo | sort -u | wc -l)
    - export CTEST_OUTPUT_ON_FAILURE=1
    - export CTEST_PARALLEL_LEVEL=4
    # running as root does not matter inside Docker containers
    - export OMPI_ALLOW_RUN_AS_ROOT=1
    - export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

# template for build jobs
.build_template:
    # don't wait for jobs in previous stages to complete before starting this job
    needs: []
    variables:
        # sccache rewrites paths below this base to relative form before hashing, so the same
        # job hits the same entries on a different runner, node or fork checkout.
        # The build directory must stay inside this base (build/$CI_JOB_NAME_SLUG) - a build
        # outside of $CI_PROJECT_DIR would hash its absolute paths verbatim and silently
        # never hit the cache.
        SCCACHE_BASEDIRS: "${CI_PROJECT_DIR}"
        # namespaces the shared S3 bucket and keeps TNL entries apart from other projects;
        # the bucket itself is configured with CI/CD variables in the project settings
        # (SCCACHE_BUCKET, SCCACHE_ENDPOINT, SCCACHE_REGION, SCCACHE_S3_USE_SSL and the
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY credentials)
        SCCACHE_S3_KEY_PREFIX: "tnl/"
        # by default the daemon shuts itself down after 10 idle minutes, which can happen
        # between compiles of a long build
        SCCACHE_IDLE_TIMEOUT: "0"
        # the capability check reads and writes .sccache_check in the bucket: a throttled backend
        # fails the server startup, and a failed write probe silently downgrades the cache to
        # read-only, so trust the configured rw_mode instead
        SCCACHE_SKIP_CACHE_CHECK: "1"
    script:
        - *env_setup
        # GPU test jobs need the device passed into the container, otherwise the tests fail with misleading errors
        - if [[ ${USE_CUDA} == "yes" && ( ${MATRIX_TARGET} == "tests" || ${MATRIX_TARGET} == "matrix_tests" ) ]]; then
              nvidia-smi || {
                  echo "ERROR, no NVIDIA GPU in the container, check the runner configuration";
                  exit 1;
              };
          fi
        - if [[ ${USE_HIP} == "yes" && ( ${MATRIX_TARGET} == "tests" || ${MATRIX_TARGET} == "matrix_tests" ) ]]; then
              /opt/rocm/bin/rocminfo >/dev/null || {
                  echo "ERROR, no AMD GPU in the container, check the runner configuration";
                  exit 1;
              };
          fi
        # Write access to the shared cache is limited to the upstream project. Fork pipelines
        # run in the fork, which never sees this project's CI/CD variables, so this guard is
        # defense in depth (group/instance-level credentials, fork MRs run in this project).
        # The path below must be kept in sync: after a rename it silently degrades to
        # read-only and the cache stops warming.
        - if [[ "${CI_PROJECT_PATH}" != "tnl-project/tnl" || ( -n "${CI_MERGE_REQUEST_SOURCE_PROJECT_PATH:-}" && "${CI_MERGE_REQUEST_SOURCE_PROJECT_PATH}" != "${CI_PROJECT_PATH}" ) ]]; then
              export SCCACHE_S3_RW_MODE="READ_ONLY";
          fi
        # cmake enables the compiler launcher by itself when sccache is found, see
        # cmake/sccache.cmake, so this only warns about images that do not ship it
        - if command -v sccache >/dev/null 2>&1; then
              sccache --zero-stats || echo "WARNING, sccache --zero-stats failed, the cache may be misconfigured";
          else
              echo "WARNING, sccache not found in this image, building without the compiler cache";
          fi
        # handle the $MATRIX_TARGET variable from .matrix_template
        - if [[ ${MATRIX_TARGET} == "tests" ]]; then
                BUILD_TARGETS=("non-matrix-tests");
          elif [[ ${MATRIX_TARGET} == "matrix_tests" ]]; then
                BUILD_TARGETS=("matrix-tests");
          elif [[ ${MATRIX_TARGET} == "nontests" ]]; then
                BUILD_TARGETS=("benchmarks" "examples" "tools");
          elif [[ ${BUILD_DOC} == "yes" ]]; then
                BUILD_TARGETS=("documentation");
          fi
        - cmake -B "./build/$CI_JOB_NAME_SLUG" -S . -G Ninja
                -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
                -DCMAKE_INSTALL_PREFIX="$(pwd)/install_prefix/$CI_JOB_NAME_SLUG"
                -DCMAKE_C_FLAGS="${CMAKE_C_FLAGS}"
                -DCMAKE_CXX_FLAGS="${CMAKE_CXX_FLAGS}"
                -DCMAKE_CUDA_FLAGS="${CMAKE_CUDA_FLAGS}"
                -DCMAKE_HIP_FLAGS="${CMAKE_HIP_FLAGS}"
                -DCMAKE_EXE_LINKER_FLAGS="${CMAKE_EXE_LINKER_FLAGS}"
                -DCMAKE_SHARED_LINKER_FLAGS="${CMAKE_SHARED_LINKER_FLAGS}"
                -DTNL_USE_OPENMP=${USE_OPENMP}
                -DTNL_USE_MPI=${USE_MPI}
                -DTNL_USE_CUDA=${USE_CUDA}
                -DTNL_USE_HIP=${USE_HIP}
                -DTNL_USE_MARCH_NATIVE_FLAG=${TNL_USE_MARCH_NATIVE_FLAG}
                -DTNL_BUILD_COVERAGE=${BUILD_COVERAGE}
                -DTNL_USE_CI_FLAGS=yes
        # build the given targets
        - cmake --build "./build/$CI_JOB_NAME_SLUG" --parallel ${NUM_CORES} --target "${BUILD_TARGETS[@]}"
        # the daemon is reaped together with the rest of the script section, so the stats have
        # to be printed here and not in after_script
        - if command -v sccache >/dev/null 2>&1; then sccache --show-stats; fi
        # we have ctest options set in the preset, but ctest does not allow to override the build directory
        # https://gitlab.kitware.com/cmake/cmake/-/issues/23982
        - "sed 's|\"binaryDir\": \"${sourceDir}/build\",|\"binaryDir\": \"${sourceDir}\",|' CMakePresets.json > \"./build/$CI_JOB_NAME_SLUG/CMakePresets.json\""
        - pushd "./build/$CI_JOB_NAME_SLUG/"
        - if [[ ${MATRIX_TARGET} == "tests" ]]; then
                ctest --preset non-matrix-tests --output-junit "./tests-report.xml";
          elif [[ ${MATRIX_TARGET} == "matrix_tests" ]]; then
                ctest --preset matrix-tests --output-junit "./tests-report.xml";
          fi
        - popd
    rules:
        - changes:
            - src/**/*.{h,hpp,cpp,cu,hip}
            - "**/CMakeLists.txt"
            - cmake/*
            - .gitlab-ci.yml
    interruptible: true

.matrix_template:
    parallel:
        matrix:
            - MATRIX_TARGET:
                - tests
                - matrix_tests
                - nontests
              BUILD_TYPE:
                - Debug
                - Release

# template for collecting code coverage
.coverage_template:
    # NOTE: gcovr is very slow, maybe it could be solved with fastcov:
    # https://github.com/gcovr/gcovr/issues/289
    # https://github.com/RPGillespie6/fastcov
    # NOTE: when enabling, the BUILD_COVERAGE env var must be switched to yes
    #after_script:
    #    - mkdir coverage_html
    #    - if [[ ${CXX} == "clang++" ]]; then
    #            GCOV_COMMAND="llvm-cov gcov";
    #      else
    #            GCOV_COMMAND="gcov";
    #      fi
    #    - gcovr --print-summary --html-details coverage_html/coverage.html --xml coverage.xml --xml-pretty --gcov-executable "${GCOV_COMMAND}" --exclude-unreachable-branches --root "${CI_PROJECT_DIR}" --filter "${CI_PROJECT_DIR}/src/TNL/"
    coverage: /^\s*lines:\s*\d+.\d+\%/
    artifacts:
        name: ${CI_JOB_NAME_SLUG}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
        expire_in: 7 days
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
            junit: "build/$CI_JOB_NAME_SLUG/tests-report.xml"
        paths:
            - coverage_html/

# template for registering tests-report.xml as an artifact
.tests_report_template:
    artifacts:
        name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
        expire_in: 7 days
        reports:
            junit: "build/$CI_JOB_NAME_SLUG/tests-report.xml"

# Dummy build job to ensure that a pipeline is created for a merge request, even
# when there were no changes.
dummy build job:
    stage: build
    script: echo "dummy"
    only:
        - merge_requests
    except:
        changes:
            # .build_template
            - src/**/*.{h,hpp,cpp,cu,hip}
            - "**/CMakeLists.txt"
            - cmake/*
            - .gitlab-ci.yml
            # build documentation
            - Documentation/**/*


# Manual jobs for verification of GPU passthrough
cuda-gpu-check:
    extends: .nvcc
    stage: build:cuda
    script:
        - nvidia-smi
    rules:
        - if: $GITLAB_CI == "false"
          when: manual
          allow_failure: true

rocm-gpu-check:
    extends: .hip_rocm
    stage: build:hip_rocm
    script:
        - source /etc/profile
        - rocminfo
    rules:
        - if: $GITLAB_CI == "false"
          when: manual
          allow_failure: true





nvcc:
    extends:
        - .build_template
        - .matrix_template
        - .nvcc

nvhpc:
    stage: build:cuda
    tags:
        - docker
        - nvidia
    extends:
        - .build_template
        #- .matrix_template
        - .nvhpc
    # NOTE: nvc++ has huge memory requirements in Release mode, so we skip it from the matrix
    parallel:
        matrix:
            - MATRIX_TARGET:
                - tests
                - matrix_tests
                - nontests
              BUILD_TYPE:
                - Debug

clang_cuda:
    extends:
        - .build_template
        - .matrix_template
        - .clang_cuda


hip_rocm:
    extends:
        - .build_template
        - .matrix_template
        - .hip_rocm


gcc:
    extends:
        - .build_template
        - .matrix_template
        - .gcc

clang:
    extends:
        - .build_template
        - .matrix_template
        - .clang

icpx:
    extends:
        - .build_template
        - .matrix_template
        - .icpx





alpine:
    stage: build:host
    # NOTE: library/alpine does not have bash, so the .build_template script fails
    #image: "docker.io/library/alpine:latest"
    image: "docker.io/library/bash:latest"
    before_script:
        - apk add build-base git cmake ninja openmpi-dev zlib-dev
        # instruct mpirun to not use ssh
        - export OMPI_MCA_plm_rsh_agent=sh
    extends:
        - .build_template
        - .matrix_template
        #- .gcc
    variables:
        <<: *default_cmake_flags
        CXX: g++
        CC: gcc
        # avoid spurious error due to Alpine's GCC
        CMAKE_CXX_FLAGS: "-Wno-error=array-bounds -march=x86-64-v3"

debian:
    stage: build:host
    image: "docker.io/${IMAGE_NAME}"
    before_script:
        - apt-get update
        # workaround for gfortran problem in the gcc images
        # (there is a local gfortran that conflicts with the alternatives system)
        - if test -f /usr/local/bin/gfortran; then
              ln -s /usr/local/bin/gfortran /usr/bin/gfortran;
          fi
        # install cmake (the images have none or older than the required 3.30)
        - wget -q --tries=3 https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-linux-x86_64.sh
        - echo "9c5c78ff9f5c8c1acc5c496a7d27adafacb3a78d5b2d39b3cd4d97103656bf5b  cmake-4.4.4-linux-x86_64.sh" | sha256sum -c
        - bash cmake-4.4.4-linux-x86_64.sh --skip-license --prefix=/usr
        # install dependencies for TNL
        - apt-get install -y build-essential git ninja-build libopenmpi-dev zlib1g-dev
        # select the compiler
        - if command -v clang++; then
              export CXX=clang++;
              export CC=clang;
          else
              export CXX=g++;
              export CC=gcc;
          fi
    extends:
        - .build_template
    variables:
        <<: *default_cmake_flags
    parallel:
        matrix:
            - MATRIX_TARGET:
                - tests
              BUILD_TYPE:
                - Debug
              IMAGE_NAME:
                # https://hub.docker.com/_/gcc
                - gcc:12
                - gcc:13
                - gcc:14
                - gcc:15
                - gcc:16
                # https://hub.docker.com/r/silkeh/clang
                - silkeh/clang:15
                - silkeh/clang:16
                - silkeh/clang:17
                - silkeh/clang:18
                - silkeh/clang:19
                - silkeh/clang:20
                - silkeh/clang:21
                - silkeh/clang:22





documentation:
    extends: .build_template
    stage: build:cuda
    tags:
        - docker
        - nvidia
    variables:
        <<: *default_cmake_flags
        USE_OPENMP: "yes"
        USE_CUDA: "yes"
        USE_MPI: "yes"
        BUILD_TYPE: Debug
        # build output snippets for documentation
        BUILD_DOC: "yes"
        # CUDA builds run on runners with GPU passthrough
        OMPI_MCA_accelerator: "cuda"
    rules:
        - changes:
            - Documentation/**/*
            - src/TNL/**/*.{h,hpp}
            - .gitlab-ci.yml
    # store the built documentation for deployment
    after_script:
        - mv "./build/$CI_JOB_NAME_SLUG/Documentation/html" "./html"
    artifacts:
        paths:
            - ./html/
        expire_in: 7 days

deploy-documentation:
    stage: deploy
    # specify that this is a Pages job and publishes the default public directory
    pages: true
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
            - Documentation/**/*
            - src/TNL/**/*.{h,hpp}
            - .gitlab-ci.yml
    # use "dependencies" instead of "needs" to deploy only when the entire pipeline succeeds
    dependencies:
        - documentation
    image: "quay.io/archlinux/archlinux:latest"
    script:
        - mv ./html/ public/
    artifacts:
        paths:
            - public

clang-format:
    stage: lint
    rules:
        - changes:
            - Documentation/**/*.{h,hpp,cpp,cu,hip}
            - src/TNL/**/*.{h,hpp,cpp,cu,hip}
            - .clang-format
            - scripts/run-clang-format.py
            - .gitlab-ci.yml
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm clang python
    script:
        - ./scripts/run-clang-format.py
                --color always
                --style file
                --exclude "src/TNL/3rdparty/*"
                --recursive
                Documentation
                src
    interruptible: true

clang-tidy:
    stage: lint
    rules:
        - changes:
            - Documentation/**/*.{h,hpp,cpp,cu,hip}
            - src/**/*.{h,hpp,cpp,cu,hip}
            - "**/CMakeLists.txt"
            - cmake/*
            - .clang-tidy
            - .gitlab-ci.yml
    variables:
        BUILD_DIR: "./build/$CI_JOB_NAME_SLUG"
        CMAKE_BUILD_TYPE: Debug
        CXX: clang++
        CC: clang
        TNL_USE_OPENMP: ON
        TNL_USE_MPI: ON
        TNL_USE_CUDA: OFF
        TNL_USE_CI_FLAGS: ON
    before_script:
        - pacman -Syu --needed --noconfirm just
    script:
        - just check-clang-tidy "$TARGET_PATH"
    parallel:
        matrix:
            - TARGET_PATH:
                - "Documentation/*"
                - "src/Benchmarks/*"
                - "src/Examples/*"
                - "src/Tools/*"
                # running clang-tidy on unit tests takes too long and is not very useful
                # (most of the reported problems are in header files and they should be already
                # reported by running clang-tidy on the previous targets)
                #- "src/UnitTests/*"
    interruptible: true

cmake-format:
    stage: lint
    rules:
        - changes:
            - "**/CMakeLists.txt"
            - "**/*.cmake"
            - .gersemirc
            - .gitlab-ci.yml
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm python-gersemi
    script:
        - gersemi --color --diff --check .
    interruptible: true

copyright-headers:
    stage: lint
    rules:
        - changes:
            - src/**/*.{h,hpp,cpp,cu,hip}
            - scripts/updage-copyright-headers.py
            - .gitlab-ci.yml
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm git python
    script:
        - ./scripts/update-copyright-headers.py
                --dir src/
                --exclude
                    'src/TNL/3rdparty/*'
                    'src/UnitTests/*'
                    'src/Benchmarks/Sorting/ReferenceAlgorithms/*'
                    'src/Examples/Hypre/*'
        - git --no-pager diff --color=always --exit-code
    interruptible: true

ruff format:
    stage: lint
    image: "quay.io/archlinux/archlinux:base"
    before_script:
        - pacman -Syu --needed --noconfirm ruff
    script:
        - ruff format --diff
    variables:
        FORCE_COLOR: 1
    interruptible: true

ruff check:
    stage: lint
    image: "quay.io/archlinux/archlinux:base"
    before_script:
        - pacman -Syu --needed --noconfirm ruff
    script:
        - ruff check --exit-zero
        - ruff check --output-format=gitlab > code-quality-report.json
    variables:
        FORCE_COLOR: 1
    artifacts:
        reports:
            codequality: $CI_PROJECT_DIR/code-quality-report.json
    interruptible: true

typos:
    stage: lint
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm typos
    script:
        - typos --color always --sort
    interruptible: true

citation-cff:
    stage: lint
    rules:
        - changes:
            - .gitlab-ci.yml
            - CITATION.cff
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm check-jsonschema
    script:
        - check-jsonschema --color always --schemafile https://raw.githubusercontent.com/citation-file-format/citation-file-format/refs/heads/main/schema.json --force-filetype yaml CITATION.cff
    interruptible: true

shellcheck:
    stage: lint
    image: "quay.io/archlinux/archlinux:latest"
    before_script:
        - pacman -Syu --needed --noconfirm git just shellcheck
    script:
        - just check-recipes check-shellcheck
    interruptible: true
