<script type="text/javascript">
  // Reorder the top-level treeview items: the built-in pages tab emits its
  // content as one block, which cannot be interleaved with tab-based entries.
  window.addEventListener('load', function () {
    const order = ['Comparison with other libraries', "Users' Guide",
                   'Algorithm reference', 'API reference', "Developers' Guide"];
    // All top-level entries are children of the single page root node ("Template
    // Numerical Library"), so the list to reorder is the ul nested under it.
    const rootUl = [...document.querySelectorAll('#nav-tree ul')].find(u =>
      [...u.children].filter(c => c.tagName === 'LI').filter(li => {
        const a = li.querySelector(':scope > .item .label a');
        return a && order.includes(a.textContent.trim());
      }).length >= 2);
    if (!rootUl) return;
    const items = [...rootUl.children].filter(e => e.tagName === 'LI');
    const byName = new Map();
    items.forEach(li => {
      const a = li.querySelector(':scope > .item .label a');
      if (a && order.includes(a.textContent.trim())) byName.set(a.textContent.trim(), li);
    });
    // insert at the position of the first matched item
    const anchor = items.find(li => [...byName.values()].includes(li));
    if (!anchor) return;
    const ordered = order.map(n => byName.get(n)).filter(Boolean);
    if (ordered.length < 2) return;
    const marker = document.createElement('li');
    rootUl.insertBefore(marker, anchor);
    ordered.forEach(li => { rootUl.removeChild(li); });
    ordered.forEach(li => { rootUl.insertBefore(li, marker); });
    marker.remove();
  });
</script>
